<head>
	<title>SSC swim timeslots</title>
</head>
<body bgcolor=black text=gray>
<h3><b>Datums stunda:(rezervēts/kopā)</b></h3>
<div id="out"></div>
<script>
const divOut = document.getElementById('out');
const timeZone = "Europe/Riga";
const dateFormatter = new Intl.DateTimeFormat("en-GB", {
  timeZone, year: "numeric", month: "2-digit", day: "2-digit"
});
const hourFormatter = new Intl.DateTimeFormat("en-GB", {
  timeZone, hour: "numeric", hourCycle: "h23"
});

function rigaDay(date) {
  const parts = Object.fromEntries(dateFormatter.formatToParts(date).map(part => [part.type, part.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function addDays(day, count) {
  const date = new Date(day + "T00:00:00Z");
  date.setUTCDate(date.getUTCDate() + count);
  return date.toISOString().slice(0, 10);
}

function rigaMidnight(day) {
  const target = Date.parse(day + "T00:00:00Z");
  let timestamp = target;
  // Resolve Riga's calendar midnight, correcting again if the offset changes.
  for (let i = 0; i < 2; i++) {
    const date = new Date(timestamp);
    const localTimestamp = Date.parse(rigaDay(date) + "T00:00:00Z")
      + Number(hourFormatter.format(date)) * 60 * 60 * 1000;
    timestamp += target - localTimestamp;
  }
  return new Date(timestamp).toISOString();
}

function fetchDay(day) {
  // Convert each Riga midnight separately: DST days can be 23 or 25 hours.
  const from = rigaMidnight(day);
  const to = rigaMidnight(addDays(day, 1));

  fetch("https://eu.bookla.com/api/v1/client/companies/042fb9ab-5dd4-4b78-a8ac-d1229322e93d/services/09b3b303-fb77-45d9-bcf2-1434b672f679/times", {
    method: "POST",
    mode: "cors",
    credentials: "omit",
    headers: {
      "accept": "*/*",
      "content-type": "application/json",
      "x-api-key": "gCLUIxLBgnfRK9A6CIGPtJXmqG09COpIEBFm"
    },
    body: JSON.stringify({
      from: from,
      to: to,
      resourceIDs: [],
      tickets: { "c9cd2168-2287-492b-914e-c4b01bd10ebc": 1 }
    })
  })
    .then(response => response.json())
    .then(data => {
      divOut.innerHTML += day;

      // Response may be { times: [...] }, { data: [...] }, or grouped by resource.
      let slots = [];
      if (Array.isArray(data)) slots = data;
      else if (Array.isArray(data.times)) slots = data.times;
      else if (data.times && typeof data.times === 'object') {
        Object.values(data.times).forEach(arr => { if (Array.isArray(arr)) slots = slots.concat(arr); });
      } else if (Array.isArray(data.data)) slots = data.data;

      slots.forEach(ts => {
        const start = ts.startTime || ts.start || ts.time;
        if (!start) return;
        const hour = Number(hourFormatter.format(new Date(start)));
        let info;
        if (ts.spotsTotal !== undefined && ts.spotsTotal !== null)
          info = (ts.bookedSpots ?? 0) + "/" + ts.spotsTotal;
        else if (ts.totalSpots !== undefined && ts.totalSpots !== null)
          info = (ts.bookedSpots ?? 0) + "/" + ts.totalSpots;
        else if (ts.spotsTaken !== undefined && ts.spotsTotal !== undefined)
          info = ts.spotsTaken + "/" + ts.spotsTotal;
        else if (ts.available !== undefined)
          info = ts.available;
        else
          info = "?";
        divOut.innerHTML += "&nbsp;&nbsp;&nbsp;" + hour + ":(" + info + ")";
      });
      divOut.innerHTML += "\n<br>";
    })
    .catch(error => {
      console.error("Request error:", error);
    });
}// EO fetchDay(day)

const today = rigaDay(new Date());
for (let i = 0; i < 3; i++) {
  const day = addDays(today, i);
  setTimeout(() => fetchDay(day), i * 1000);
}

</script>

</body>
